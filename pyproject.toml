[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subclipper"
version = "0.1.0"
description = "Video/subtitle processing web app"
dependencies = [
    "flask>=3.1.0",
    "sub2clip @ git+https://github.com/lpalinckx/sub2clip.git@sub2clip-v2.3.1#subdirectory=packages/sub2clip"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
subclipper = "subclipper.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
