{% if sub is none %}
    <h2 class="text-lg text-base-content font-semibold w-full h-full flex flex-col justify-center items-center">
        Select a subtitle from the list and tweak it here...
    </h2>
{% else %}
<form
    class="w-full flex flex-col justify-between gap-2 px-2"
    hx-get="/gif_view"
    hx-push-url="false"
    hx-replace-url="false"
    hx-target="#gif-view"
    hx-swap="innerHTML"
    hx-on::config-request="configureRequestWithAllClips(event)"
>
    <div id="subtitle-settings">
        {% with %}
            {% include "clip_settings.html" %}
        {% endwith %}
    </div>

    <div
        id="global-settings"
        hx-get="/default_settings"
        hx-trigger="load once"
        hx-target="this"
    >
    </div>

    <button
        class="btn btn-primary"
        type="submit"
    >
        Generate
    </button>

    <div id="saved-clips" style="display: none;"></div>
</form>

<script>
function configureRequestWithAllClips(event) {
    // Save the current visible clip state first
    const currentClip = document.querySelector('[id^="clip-"]');
    if (currentClip) {
        const clipId = currentClip.getAttribute('data-clip-id');
        saveCurrentClipState(clipId);
    }

    const params = new URLSearchParams();

    const globalSettings = document.getElementById('global-settings');
    if (globalSettings) {
        const globalInputs = globalSettings.querySelectorAll('input, select, textarea');
        globalInputs.forEach(input => {
            if (input.name) {
                if (input.type === 'checkbox') {
                    if (input.checked) {
                        params.append(input.name, 'on');
                    }
                } else if (input.type === 'radio') {
                    if (input.checked) {
                        params.append(input.name, input.value);
                    }
                } else {
                    params.append(input.name, input.value);
                }
            }
        });
    }

    const savedContainer = document.getElementById('saved-clips');
    const allClips = {};

    const savedClips = savedContainer.querySelectorAll('[data-saved-clip]');
    savedClips.forEach(savedClip => {
        const inputs = savedClip.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            if (input.name && input.name.startsWith('clips[')) {
                const value = input.type === 'checkbox' || input.type === 'radio'
                    ? (input.checked ? input.value : '')
                    : input.value;
                if (value !== '') {
                    params.append(input.name, value);
                }
            }
        });
    });

    if (currentClip) {
        const currentInputs = currentClip.querySelectorAll('input[name^="clips"], textarea[name^="clips"]');
        currentInputs.forEach(input => {
            if (input.name) {
                const value = input.type === 'checkbox' || input.type === 'radio'
                    ? (input.checked ? input.value : '')
                    : input.value;
                if (value !== '') {
                    params.append(input.name, value);
                }
            }
        });
    }

    event.detail.path = event.detail.path.split('?')[0] + '?' + params.toString();
}
</script>
{% endif %}
