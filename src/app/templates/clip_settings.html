<div id="clip-{{ sub.id }}" >
    <fieldset class="flex w-full gap-2">
        <legend class="fieldset-legend">Timeline</legend>
        <button
            class="flex-1 btn btn-dash"
            title="Add previous clip"
            type="button"
            hx-get="/sub_data/{{ sub['prv'] }}"
            hx-target="#subtitle-settings"
            hx-on::before-request='saveCurrentClipState("{{ sub.id }}")''
            hx-on::after-swap='updateBtnClass(this, {{ sub.get("prv") | tojson }})'
            {% if not sub.prv %}
            disabled
            {% endif %}
        >
            + Prev clip
        </button>
        <div class="flex-1 btn btn-soft cursor-default hover:bg-none hover:shadow-none pointer-events-none select-none">
            Current clip
        </div>
        <button
            class="flex-1 btn btn-dash"
            title="Add next clip"
            type="button"
            hx-get="/sub_data/{{ sub['nxt'] }}"
            hx-target="#subtitle-settings"
            hx-on::before-request='saveCurrentClipState("{{ sub.id }}")''
            hx-on::after-swap='updateBtnClass(this, {{ sub.get("nxt") | tojson }})'
            {% if not sub.nxt %}
            disabled
            {% endif %}
        >
            + Next clip
        </button>
    </fieldset>

    <fieldset>
        <legend class="fieldset-legend">Subtitles</legend>
        <textarea
            name="clips[{{ sub.id }}][text]"
            type="text"
            class="textarea w-full"
        >{{sub.text | join('\n')}}</textarea>
    </fieldset>

    <div class="flex flex-row justify-between gap-4">
        <fieldset class="w-full">
            <legend class="fieldset-legend flex items-center gap-2">
                Clip Timing
            </legend>
            <dual-handle-slider
                id="dual-handle-slider"
                step="0.01"
                padding="10"
                start="{{ sub.start_time }}"
                end="{{ sub.end_time }}"
                originalStart="{{ sub.original_start_time }}"
                originalEnd="{{ sub.original_end_time }}"
                data-clip-id="{{ sub.id }}"
                {% if errs is not none and 'start' in errs %}
                startError="{{ errs['start'] }}"
                {% endif %}
                {% if errs is not none and 'end' in errs %}
                endError="{{ errs['end'] }}"
                {% endif %}
            />

            <input type="hidden" name="clips[{{ sub.id }}][start_time]" data-clip-field="start_time" value="{{ sub.start_time }}">
            <input type="hidden" name="clips[{{ sub.id }}][end_time]" data-clip-field="end_time" value="{{ sub.end_time }}">
        </fieldset>
    </div>
</div>


<script>
    if (!window.clipSequence) {
        window.clipSequence = new Set();
    }
    window.clipSequence.add('{{ sub.id }}');

    function saveCurrentClipState(clipId) {
        const clipContainer = document.getElementById(`clip-${clipId}`);
        if (!clipContainer) return;

        const savedContainer = document.getElementById('saved-clips');

        // Remove old saved state for this clip if it exists
        const oldSaved = savedContainer.querySelector(`[data-saved-clip="${clipId}"]`);
        if (oldSaved) {
            oldSaved.remove();
        }

        // Create a container for saved inputs
        const savedClip = document.createElement('div');
        savedClip.setAttribute('data-saved-clip', clipId);

        // Save all input values
        const inputs = clipContainer.querySelectorAll('input[name^="clips"], textarea[name^="clips"]');
        inputs.forEach(input => {
            const clone = input.cloneNode(true);
            savedClip.appendChild(clone);
        });

        savedContainer.appendChild(savedClip);
    }

    function restoreClipState(clipId) {
        const savedContainer = document.getElementById('saved-clips');
        const savedClip = savedContainer.querySelector(`[data-saved-clip="${clipId}"]`);

        if (!savedClip) return;

        const clipContainer = document.getElementById(`clip-${clipId}`);
        if (!clipContainer) return;

        // Restore saved values
        const savedInputs = savedClip.querySelectorAll('input, textarea');
        savedInputs.forEach(savedInput => {
            const name = savedInput.getAttribute('name');
            const currentInput = clipContainer.querySelector(`[name="${name}"]`);

            if (currentInput) {
                if (savedInput.type === 'checkbox' || savedInput.type === 'radio') {
                    currentInput.checked = savedInput.checked;
                } else {
                    currentInput.value = savedInput.value;
                }
            }
        });

        const startInput = savedClip.querySelector('[data-clip-field="start_time"]');
        const endInput = savedClip.querySelector('[data-clip-field="end_time"]');
        const slider = clipContainer.querySelector('dual-handle-slider');

        if (startInput && endInput) {
            slider.setAttribute('start', startInput.value);
            slider.setAttribute('end', endInput.value);
        }
    }


    // Update the button class to be btn-success whenever the nxt/prv exists
    document.addEventListener('htmx:afterSwap', (evt) => {
        if (evt.detail.target.id === 'subtitle-settings') {
            const buttons = document.querySelectorAll('#subtitle-settings button[hx-get*="/sub_data/"]');
            buttons.forEach(button => {
                const hxGet = button.getAttribute('hx-get');
                const clipId = hxGet.split('/').pop();
                updateBtnClass(button, clipId);
            });
        }
    });

    function updateBtnClass(button, clipId) {
        const savedContainer = document.getElementById('saved-clips');
        const clipExists = savedContainer.querySelector(`[data-saved-clip="${clipId}"]`) !== null;

        button.classList.remove('btn-dash', 'btn-success')
        button.classList.add(clipExists ? 'btn-success' : 'btn-dash')
    }

    // Listen for HTMX after settle to restore state if needed
    document.addEventListener('htmx:afterSettle', (evt) => {
        const clipContainer = evt.target.querySelector('[id^="clip-"]');
        if (clipContainer) {
            const clipId = clipContainer.getAttribute('data-clip-id');
            if (clipId) {
                restoreClipState(clipId);
                window.clipSequence.add(parseInt(clipId));
            }
        }
    });

    // Update hidden inputs when slider changes
    document.addEventListener('htmx:afterSwap', () => {
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'attributes' && mutation.target.tagName === 'DUAL-HANDLE-SLIDER') {
                    const slider = mutation.target;
                    const clipId = slider.getAttribute('data-clip-id');
                    const clipContainer = document.getElementById(`clip-${clipId}`);

                    if (clipContainer && (mutation.attributeName === 'start' || mutation.attributeName === 'end')) {
                        const startInput = clipContainer.querySelector('[data-clip-field="start_time"]');
                        const endInput = clipContainer.querySelector('[data-clip-field="end_time"]');

                        if (startInput) startInput.value = slider.getAttribute('start');
                        if (endInput) endInput.value = slider.getAttribute('end');
                    }
                }
            });
        });

        observer.observe(document.body, {
            attributes: true,
            childList: true,
            subtree: true,
            attributeFilter: ['start', 'end'],
        });
    });
</script>
