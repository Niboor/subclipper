<div class="flex flex-col md:flex-row items-center gap-2">
    {% if progress is none %}
        <div class="loading loading-sm loading-ring"></div>
        <div class="text-xs md:text-inherit">Checking cache...</div>
    {% elif progress < 1 %}
        <div class="loading loading-sm" ></div>
        <div class="text-xs md:text-inherit">Scanning all files... {{ (progress * 100)|round(precision=2, method='common') }}%</div>
    {% endif %}
</div>
